<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Project Development (SYP), Unit 1: Software Project Implementation."
    />
    <title>Project Development (SYP) | Unit 1</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css"
    />
    <style>
      :root {
        color-scheme: light;
        background: #f2f0e9;
      }

      body {
        margin: 0;
        background: #f2f0e9;
      }

      .reveal {
        color: #20231f;
        font-family: Georgia, "Times New Roman", serif;
      }

      .reveal .slides section {
        padding: 0;
        background: transparent;
      }

      .reveal .slides section img.slide-artwork {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        margin: 0 !important;
        border: 0 !important;
        object-fit: contain;
        box-shadow: none !important;
      }

      .reveal .slides section.native-slide {
        box-sizing: border-box;
        width: 1024px;
        height: 768px;
        padding: 72px 88px;
        background: #f2f0e9;
        color: #20231f;
        text-align: left;
      }

      .reveal .slides section.native-slide img.native-slide__logo {
        position: absolute;
        top: 0%;
        right: 2%;
        width: 25%;
        height: 25%;
        max-width: 25%;
        max-height: 25%;
        margin: 0;
        border: 0;
        object-fit: contain;
        box-shadow: none;
      }

      .native-slide__inner {
        display: flex;
        height: 100%;
        flex-direction: column;
        justify-content: center;
      }

      .native-slide__eyebrow {
        margin: 0 0 22px;
        color: #287d78;
        font-family: Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .native-slide h2 {
        margin: 0 0 28px;
        color: #20231f;
        font-size: 52px;
        line-height: 1.08;
      }

      .native-slide__lead {
        max-width: 790px;
        margin: 0 0 38px;
        font-size: 27px;
        line-height: 1.35;
      }

      .native-slide__qualities {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
        margin: 0;
        padding: 26px 0 0;
        border-top: 2px solid #287d78;
        list-style: none;
      }

      .native-slide__qualities li {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 20px;
        line-height: 1.3;
      }

      .native-slide__qualities strong {
        color: #b9573e;
        font-size: 29px;
      }

      .native-slide__equation {
        display: flex;
        align-items: baseline;
        gap: 17px;
        margin: 4px 0 32px;
        color: #287d78;
        font-family: Arial, sans-serif;
        font-size: 58px;
        font-weight: 700;
      }

      .native-slide__equation small {
        color: #20231f;
        font-size: 21px;
        font-weight: 400;
      }

      .native-slide__totals {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 42px;
        padding-top: 25px;
        border-top: 2px solid #287d78;
      }

      .native-slide__totals p {
        margin: 0;
        font-size: 20px;
        line-height: 1.4;
      }

      .native-slide__totals strong {
        display: block;
        margin-bottom: 7px;
        color: #b9573e;
        font-size: 35px;
      }

      .native-slide__note {
        margin: 24px 0 0;
        font-size: 18px;
        line-height: 1.4;
      }

      .native-slide__setup {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 58px;
        margin-top: 12px;
      }

      .native-slide__setup h3 {
        margin: 0 0 18px;
        color: #287d78;
        font-family: Arial, sans-serif;
        font-size: 23px;
      }

      .native-slide__setup p,
      .native-slide__setup li {
        font-size: 23px;
        line-height: 1.45;
      }

      .native-slide__setup ul {
        margin: 0;
        padding-left: 28px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: pre-wrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="reveal" aria-label="Project Development presentation">
      <div class="slides" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
    <script>
      const slideContent = [
        {
          label: "Project Development (SYP), Unit 1",
          text: "Project Development (SYP)\nPeter Bauer\nUnit 1",
        },
        {
          label: "Software Project Implementation: project cartoon",
          text: "Software Project Implementation. Project cartoon labels, in order: How the customer explained it; how the project leader understood it; how the analyst designed it; how the programmer wrote it; what the beta testers received; how the business consultant described it; how the project was documented; what operations installed; how the customer was billed; how it was supported; what marketing advertised; when it was delivered; what the customer really needed; what the digg effect can do to your site; the disaster recover plan; what the customer really needed; what the digg effect can do to your site; the disaster recover plan.",
        },
        {
          label: "Let's Talk Content, section 1",
          text: "Let's Talk Content – 1",
        },
        {
          label: "Content overview",
          text: "Content\nWhat are projects?\nProject start\nProject communication\nSoftware development process models\nSystem specification\nImplementation\nTesting\nReleasing and deployment",
        },
        {
          label: "What Are Projects?",
          text: "What Are Projects?\nCollaborative enterprise\nCarefully planned\nTemporary rather than permanent\nAccomplish particular tasks\nTime constraints",
        },
        {
          label: "Project Start",
          text: "Project Start\nGive basis for the management decision of project approval. Describes: necessity of project; feasibility of project; affordability of project; market and economic effect of project.",
        },
        {
          label: "Project Communication",
          text: "Project Communication\nProject organization\nRequirements management\nProject planning\nConfiguration management\nQuality assurance\nMethods and tools",
        },
        {
          label: "Software Development Process Models",
          text: "Software Development Process Models\nWaterfall model\nV-Model\nRUP\nScrum\nDevelopment process assessments",
        },
        {
          label: "Administrivia",
          text: "Administrivia",
        },
        {
          label: "What Will We Do?",
          text: "What Will We Do?\nStart developing a serious background in project development. Learn basic project management skills. Documents beyond source code: Project Proposal, System Specification, UML Diagrams. Tools: Version Control, Virtualization, Deployment. Planning and monitoring.",
        },
        {
          label: "How Is The Course Organized?",
          text: "How Is The Course Organized?\nTheoretical background: selected parts of the book. Practical exercises: by means of smaller examples.",
        },
        {
          label: "How To Get A Grade – Main Contributions",
          text: "How To Get A Grade – Main Contributions\nOne test per semester. Date: 14. Jänner 2027. Review of project deliverables: Project proposal; System Specification; Product Burndown; Prototypes.",
        },
        {
          label: "Projects",
          text: "Projects\nSmall projects (a content-driven website)\n2 to 3 persons maximum\nFind a topic",
        },
        {
          label: "Let's Talk Content, section 2",
          text: "Let's Talk Content – 2",
        },
        {
          label: "System Specification",
          text: "System Specification\nAnalysis of the application domain: UML. Documentation of functional and non-functional requirements. Software architecture – Client Server.",
        },
        {
          label: "Implementation",
          text: "Implementation\nDocumentation of software design: UML. Coding in a team: syncing the code base between team members; collaborative coding models. Spec-driven and agentic programming. Test-driven development.",
        },
        {
          label: "Testing",
          text: "Testing\nTest strategies\nTest plans\nTest protocols",
        },
        {
          label: "Releasing/Deployment",
          text: "Releasing/Deployment\nIt runs on my computer; staging; releasing; production; virtualization; Docker files; Docker images; deployment.",
        },
      ];

      const slides = document.querySelector(".slides");
      slideContent.forEach((content, index) => {
        const section = document.createElement("section");
        const image = document.createElement("img");
        const transcript = document.createElement("p");

        section.setAttribute(
          "aria-label",
          `Slide ${index + 1}: ${content.label}`,
        );
        image.className = "slide-artwork";
        image.src = `Introduction-assets/slide-${String(index + 1).padStart(2, "0")}.jpg`;
        image.alt = content.label;
        image.loading = index === 0 ? "eager" : "lazy";
        transcript.className = "visually-hidden";
        transcript.textContent = content.text;

        section.append(image, transcript);
        slides.append(section);
      });

      const additionalSlides = [
        {
          label: "Project Name",
          content: `
            <div class="native-slide__inner">
              <p class="native-slide__eyebrow">Project work</p>
              <h2>Give your project a name</h2>
              <p class="native-slide__lead">If you cannot come up with a good project name, go back, rethink your project idea, and try again.</p>
              <ul class="native-slide__qualities">
                <li><strong>Short</strong><span>Keep it concise.</span></li>
                <li><strong>Catchy</strong><span>Make it memorable.</span></li>
                <li><strong>Suggestive</strong><span>Give a hint what the project is about.</span></li>
              </ul>
            </div>`,
        },
        {
          label: "Time to be Invested",
          content: `
            <div class="native-slide__inner">
              <p class="native-slide__eyebrow">Expected commitment</p>
              <h2>Time to be invested</h2>
              <div class="native-slide__equation" aria-label="3 hours in class plus 3 hours outside class equals 6 hours per week">
                <span>3</span><small>in class</small><span>+</span><span>3</span><small>outside</small><span>=</span><span>6</span><small>hours / week</small>
              </div>
              <div class="native-slide__totals">
                <p><strong>192 hours</strong>per team member over 32 weeks</p>
                <p><strong>576 hours</strong>for a 3-person team over 32 weeks</p>
              </div>
              <p class="native-slide__note">Outside-class time includes project work, reading material, and preparing presentations. You have a real lot of time to work on your project. You can really change the world with your product.</p>
            </div>`,
        },
        {
          label: "Exercises and Setup",
          content: `
            <div class="native-slide__inner">
              <p class="native-slide__eyebrow">Getting started</p>
              <h2>Exercises and setup</h2>
              <div class="native-slide__setup">
                <div>
                  <h3>Exercises</h3>
                  <p>Exercises are part of the course. If you cannot finish during class time, complete the remaining work at home.</p>
                </div>
                <div>
                  <h3>Set up your tools</h3>
                  <ul>
                    <li>Install Visual Studio Code</li>
                    <li>Get a GitHub account</li>
                  </ul>
                </div>
              </div>
            </div>`,
        },
      ];

      const secondSectionDivider = slides.querySelector(
        '[aria-label="Slide 14: Let\'s Talk Content, section 2"]',
      );

      additionalSlides.forEach((content) => {
        const section = document.createElement("section");
        section.className = "native-slide";
        section.setAttribute("aria-label", content.label);
        section.innerHTML = content.content;
        const logo = document.createElement("img");
        logo.className = "native-slide__logo";
        logo.src = "../../Assets/HTLLogo_ab2022_farbig.png";
        logo.alt = "HTL logo";
        logo.setAttribute("aria-hidden", "false");
        section.append(logo);
        slides.insertBefore(section, secondSectionDivider);
      });

      slides.querySelectorAll("section").forEach((section, index) => {
        const label = section
          .getAttribute("aria-label")
          .replace(/^Slide \d+: /, "");
        section.setAttribute("aria-label", `Slide ${index + 1}: ${label}`);
      });

      Reveal.initialize({
        controls: true,
        progress: true,
        hash: true,
        overview: true,
        keyboard: true,
        center: false,
        width: 1024,
        height: 768,
        margin: 0,
        minScale: 0.2,
        maxScale: 2,
        transition: "fade",
        backgroundTransition: "none",
      });
    </script>
  </body>
</html>
