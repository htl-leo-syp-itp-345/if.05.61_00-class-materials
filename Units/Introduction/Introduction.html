<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Project Development (SYP), Unit 1: Software Project Implementation."
    />
    <title>Project Development (SYP) | Unit 1</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css"
    />
    <style>
      :root {
        color-scheme: light;
        background: #f2f0e9;
      }

      body {
        margin: 0;
        background: #f2f0e9;
      }

      .reveal {
        color: #20231f;
        font-family: Georgia, "Times New Roman", serif;
      }

      .reveal .slides section {
        padding: 0;
        background: transparent;
      }

      .reveal .slides section img.slide-artwork {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        margin: 0 !important;
        border: 0 !important;
        object-fit: contain;
        box-shadow: none !important;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: pre-wrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="reveal" aria-label="Project Development presentation">
      <div class="slides" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
    <script>
      const slideContent = [
        {
          label: "Project Development (SYP), Unit 1",
          text: "Project Development (SYP)\nPeter Bauer\nUnit 1",
        },
        {
          label: "Software Project Implementation: project cartoon",
          text: "Software Project Implementation. Project cartoon labels, in order: How the customer explained it; how the project leader understood it; how the analyst designed it; how the programmer wrote it; what the beta testers received; how the business consultant described it; how the project was documented; what operations installed; how the customer was billed; how it was supported; what marketing advertised; when it was delivered; what the customer really needed; what the digg effect can do to your site; the disaster recover plan; what the customer really needed; what the digg effect can do to your site; the disaster recover plan.",
        },
        {
          label: "Let's Talk Content, section 1",
          text: "Let's Talk Content – 1",
        },
        {
          label: "Content overview",
          text: "Content\nWhat are projects?\nProject start\nProject communication\nSoftware development process models\nSystem specification\nImplementation\nTesting\nReleasing and deployment",
        },
        {
          label: "What Are Projects?",
          text: "What Are Projects?\nCollaborative enterprise\nCarefully planned\nTemporary rather than permanent\nAccomplish particular tasks\nTime constraints",
        },
        {
          label: "Project Start",
          text: "Project Start\nGive basis for the management decision of project approval. Describes: necessity of project; feasibility of project; affordability of project; market and economic effect of project.",
        },
        {
          label: "Project Communication",
          text: "Project Communication\nProject organization\nRequirements management\nProject planning\nConfiguration management\nQuality assurance\nMethods and tools",
        },
        {
          label: "Software Development Process Models",
          text: "Software Development Process Models\nWaterfall model\nV-Model\nRUP\nScrum\nDevelopment process assessments",
        },
        {
          label: "Administrivia",
          text: "Administrivia",
        },
        {
          label: "What Will We Do?",
          text: "What Will We Do?\nStart developing a serious background in project development. Learn basic project management skills. Documents beyond source code: Project Proposal, System Specification, UML Diagrams. Tools: Version Control, Virtualization, Deployment. Planning and monitoring.",
        },
        {
          label: "How Is The Course Organized?",
          text: "How Is The Course Organized?\nTheoretical background: selected parts of the book. Practical exercises: by means of smaller examples.",
        },
        {
          label: "How To Get A Grade – Main Contributions",
          text: "How To Get A Grade – Main Contributions\nOne test per semester. Date: 14. Jänner 2027. Review of project deliverables: Project proposal; System Specification; Product Burndown; Prototypes.",
        },
        {
          label: "Projects",
          text: "Projects\nSmall projects (a content-driven website)\n2 to 3 persons maximum\nFind a topic",
        },
        {
          label: "Let's Talk Content, section 2",
          text: "Let's Talk Content – 2",
        },
        {
          label: "System Specification",
          text: "System Specification\nAnalysis of the application domain: UML. Documentation of functional and non-functional requirements. Software architecture – Client Server.",
        },
        {
          label: "Implementation",
          text: "Implementation\nDocumentation of software design: UML. Coding in a team: syncing the code base between team members; collaborative coding models. Spec-driven and agentic programming. Test-driven development.",
        },
        {
          label: "Testing",
          text: "Testing\nTest strategies\nTest plans\nTest protocols",
        },
        {
          label: "Releasing/Deployment",
          text: "Releasing/Deployment\nIt runs on my computer; staging; releasing; production; virtualization; Docker files; Docker images; deployment.",
        },
      ];

      const slides = document.querySelector(".slides");
      slideContent.forEach((content, index) => {
        const section = document.createElement("section");
        const image = document.createElement("img");
        const transcript = document.createElement("p");

        section.setAttribute(
          "aria-label",
          `Slide ${index + 1}: ${content.label}`,
        );
        image.className = "slide-artwork";
        image.src = `Introduction-assets/slide-${String(index + 1).padStart(2, "0")}.jpg`;
        image.alt = content.label;
        image.loading = index === 0 ? "eager" : "lazy";
        transcript.className = "visually-hidden";
        transcript.textContent = content.text;

        section.append(image, transcript);
        slides.append(section);
      });

      Reveal.initialize({
        controls: true,
        progress: true,
        hash: true,
        overview: true,
        keyboard: true,
        center: false,
        width: 1024,
        height: 768,
        margin: 0,
        minScale: 0.2,
        maxScale: 2,
        transition: "fade",
        backgroundTransition: "none",
      });
    </script>
  </body>
</html>
